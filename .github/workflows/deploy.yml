name: Deploy to GitHub Pages

on:
  push:
    branches: 'main'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 先安裝 pnpm 工具
      - name: Install pnpm
        run: npm install -g pnpm

      # 然後再設定 Node.js 並啟用 pnpm 快取（這樣才不會找不到 pnpm）
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22 # 升級到當前穩定的 Node 版本，解決黃色驚嘆號警告
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
